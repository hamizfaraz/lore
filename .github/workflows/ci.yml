name: ci
on:
  push:
    branches: [main, c1/platform, c2/intelligence, 'integrate/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_MODE: mock
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lore
      VALKEY_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32b
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Database schema
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS timescaledb; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS citext;"
          pnpm db:push --force
          pnpm db:setup
      - run: pnpm test
      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm --filter api build
