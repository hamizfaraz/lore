# Local dev services (plan section 13 step 7). Postgres here is a stand-in for your Tiger dev
# service (timescale image + pgvector); point DATABASE_URL at Tiger when you have it.
services:
  valkey:
    image: valkey/valkey:8
    command: valkey-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [valkey:/data]
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lore
    ports: ["5432:5432"]
    volumes: [pg:/home/postgres/pgdata/data]
volumes:
  valkey: {}
  pg: {}
